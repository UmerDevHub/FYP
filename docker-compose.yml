version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: fyp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fyp_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fyp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Node.js API Service (Express.js)
  # ==========================================
  server-node:
    build:
      context: ./server-node
      dockerfile: Dockerfile
    container_name: fyp_node_api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fyp_db}
      FASTAPI_URL: http://server-python:8000
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_fyp_2026}
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server-node:/app
      - /app/node_modules

  # ==========================================
  # Python FastAPI Service (ML & Data Tasks)
  # ==========================================
  server-python:
    build:
      context: ./server-python
      dockerfile: Dockerfile
    container_name: fyp_fastapi
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fyp_db}
      NODE_API_URL: http://server-node:5000
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server-python:/app

  # ==========================================
  # React Frontend (Vite)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fyp_react_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_NODE_API_URL: http://localhost:5000/api
      VITE_FASTAPI_URL: http://localhost:8000/api
    depends_on:
      - server-node
      - server-python
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:
